name: Android build

# Unity builds are slow, so they run only on demand (Actions tab > Run workflow)
# or when a release tag such as v1.1.0 is pushed.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check Unity license secret
        if: env.HAS_UNITY_LICENSE != 'true'
        run: |
          echo "::warning::UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets are not set; skipping the Unity build."

      - name: Free disk space
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_UNITY_LICENSE == 'true'

      - name: Add Firebase packages
        if: env.HAS_UNITY_LICENSE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          fi
          python3 .github/scripts/add_firebase.py "$RUNNER_TEMP/google-services.json"

      - name: Read version from ProjectSettings
        if: env.HAS_UNITY_LICENSE == 'true'
        id: version
        run: |
          echo "name=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/^  AndroidBundleVersionCode: //p' ProjectSettings/ProjectSettings.asset)" >> "$GITHUB_OUTPUT"

      # Play rejects a bundle whose versionCode is not above every code it has already received.
      # .github/play-version-code holds the highest code uploaded to Play Console (bump it on master after
      # each upload). The higher of this commit's copy and master's copy is used, so an old branch or tag
      # cannot rely on a stale value.
      - name: Check versionCode against Play
        if: env.HAS_UNITY_LICENSE == 'true'
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          code="$CODE"
          uploaded=$(tr -d '[:space:]' < .github/play-version-code)
          on_master=$(git fetch -q --depth 1 origin master && git show FETCH_HEAD:.github/play-version-code 2>/dev/null | tr -d '[:space:]' || true)
          if [ -n "$on_master" ] && [ "$on_master" -gt "$uploaded" ]; then uploaded=$on_master; fi
          if [ "$code" -gt "$uploaded" ]; then
            echo "versionCode $code is above the last Play upload ($uploaded)."
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::versionCode $code is not above the last Play upload ($uploaded). Bump AndroidBundleVersionCode before tagging a release."
            exit 1
          else
            echo "::warning::versionCode $code is not above the last Play upload ($uploaded); Play will reject this bundle. Fine for a test APK."
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.HAS_UNITY_LICENSE == 'true'
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build with Unity
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          cliVersion: v0.1.72
          customImage: unityci/editor:ubuntu-6000.3.26f1-android-3@sha256:fd2641a484634dc6ef8aea4aa18e69cf1deeb233f6f7a56da4c24164b55d3fcd
          buildName: PlantsVsAnimals
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidAppBundle
          androidSymbolType: public
          androidKeystoreName: ${{ env.HAS_KEYSTORE == 'true' && 'upload.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Verify 16 KB page alignment
        if: env.HAS_UNITY_LICENSE == 'true'
        run: python3 .github/scripts/check_16kb_alignment.py build/Android/PlantsVsAnimals.aab

      - name: Dump manifest (package, versions, SDK levels, permissions)
        if: env.HAS_UNITY_LICENSE == 'true'
        run: |
          curl -sSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum -c -
          java -jar bundletool.jar dump manifest --bundle build/Android/PlantsVsAnimals.aab | tee manifest.xml
          grep -E 'package=|versionCode|versionName|minSdkVersion|targetSdkVersion|uses-permission' manifest.xml

      # Without this resource Crashlytics stops the app at launch, before Unity starts.
      - name: Check Crashlytics build ID
        if: env.HAS_UNITY_LICENSE == 'true' && hashFiles('Assets/google-services.json') != ''
        run: |
          java -jar bundletool.jar dump resources --bundle build/Android/PlantsVsAnimals.aab --values \
            | grep -A2 'com.crashlytics.android.build_id' || { echo "::error::Crashlytics build ID missing: the app would crash at launch."; exit 1; }

      - name: Check upload signature and build a test APK
        if: env.HAS_UNITY_LICENSE == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          keytool -printcert -jarfile build/Android/PlantsVsAnimals.aab | grep -E 'Owner|SHA1|SHA256'
          trap 'rm -f "$RUNNER_TEMP/upload.keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          java -jar bundletool.jar build-apks --mode=universal \
            --bundle build/Android/PlantsVsAnimals.aab --output "$RUNNER_TEMP/universal.apks" \
            --ks "$RUNNER_TEMP/upload.keystore" --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEYALIAS_NAME" --key-pass "pass:$KEYALIAS_PASS"
          mkdir -p test-apk
          unzip -p "$RUNNER_TEMP/universal.apks" universal.apk > test-apk/PlantsVsAnimals-test.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_UNITY_LICENSE == 'true'
        with:
          name: PlantsVsAnimals-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}${{ env.HAS_KEYSTORE != 'true' && '-unsigned' || '' }}
          path: |
            build/Android/*.aab
            test-apk/*.apk
            build/Android/*symbols*.zip
          retention-days: 30
